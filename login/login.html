<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTec Login</title>
    <link rel="shortcut icon" href="../imgs/Icone - Bibliotec.png" type="image/x-icon">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../styles/global.css">
</head>
<body>
    
    <header class="cabecalho">
        <a href="#">
            <img src="../imgs/Logo Horizontal - branca.svg" alt="Logo do sistema Bibliotec">
        </a>

        <nav class="navegacao">
            <a href="#home" class="effect-underline">home</a>
        </nav>
    </header>

    <main class="conteudo">
        <section class="login">
            <div class="login-header">
                <img src="../imgs/Icone - Bibliotec.png" alt="logo-bibliotec">
                <h1>Bem-vindo(a) à Bibliotec</h1>
                <p>Acesse sua conta para continuar</p>
            </div>
            <form>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="email@alunosenai.com" required>
                </div>
                <div class="campo">
                    <label for="password">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="password" placeholder="********" required>
                        <button id="mostar-senha" class="botao-olho">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <button type="submit">entrar</button>
                <buttom class="botao-google">
                    <img src="../imgs/flat-color-icons_google.svg" alt="Logo-google">
                    <span>Continuar com Google</span>
                </buttom>
            </form>
        </section>
    </main>

</body>
</html>
